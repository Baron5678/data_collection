services:
  postgres:
    image: postgres:16-alpine
    container_name: recruiter-task-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PGROLE}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: recruiter-task-redis
    restart: always
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data

  flask-app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: flask-app
    command: uvicorn hello_app_flask.asgi:asgi_app --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  fastapi-app:
    build:
        context: ..
        dockerfile: build/Dockerfile
    container_name: fastapi-app
    command: uvicorn hello_app_fastapi.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  celery-worker:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: celery-worker
    command: celery -A celery_app.tasks worker --loglevel=INFO --pool=solo
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: